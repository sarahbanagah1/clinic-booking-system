<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تواصل معنا | عيادتي</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="container">

            <a href="home.html" class="logo">
                🏥 عيادتي
            </a>

            <div class="nav-links">

                <a href="home.html">
                    الرئيسية
                </a>

                <a href="services.html">
                    الخدمات
                </a>

                <a href="booking.html">
                    حجز موعد
                </a>

                <a href="about.html">
                    من نحن
                </a>

                <a href="contact.html">
                    تواصل معنا
                </a>

                <a href="index.html" class="btn-login">
                    تسجيل الخروج
                </a>

            </div>

        </div>

    </nav>


    <main>

        <section class="contact-section">

            <div class="container">

                <h1>
                    تواصل معنا
                </h1>

                <p>
                    يمكنك التواصل معنا في أي وقت للاستفسار
                    عن الخدمات والمواعيد.
                </p>


                <div class="contact-content">


                    <div class="contact-info">

                        <h2>
                            معلومات التواصل
                        </h2>

                        <p>
                            📧 البريد الإلكتروني:
                            clinic@example.com
                        </p>

                        <p>
                            📞 رقم الهاتف:
                            0123456789
                        </p>

                        <p>
                            📍 العنوان:
                            الخرطوم - السودان
                        </p>

                    </div>


                    <div class="contact-form">

                        <h2>
                            أرسل رسالة
                        </h2>


                        <form id="contactForm">


                            <div class="form-group">

                                <label for="contactName">
                                    الاسم
                                </label>

                                <input
                                    type="text"
                                    id="contactName"
                                    name="name"
                                    placeholder="أدخل اسمك"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="contactEmail">
                                    البريد الإلكتروني
                                </label>

                                <input
                                    type="email"
                                    id="contactEmail"
                                    name="email"
                                    placeholder="أدخل بريدك الإلكتروني"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="message">
                                    الرسالة
                                </label>

                                <textarea
                                    id="message"
                                    name="message"
                                    rows="5"
                                    placeholder="اكتب رسالتك هنا"
                                    required
                                ></textarea>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary btn-full">
                                إرسال الرسالة
                            </button>


                        </form>

                    </div>


                </div>

            </div>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
