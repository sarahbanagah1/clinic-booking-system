<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حجز موعد عيادة - </title>
</head>
<body>
    <div class="booking-container">
        <h2>نظام حجز موعد عيادة إلكترونية</h2>
        <form id="bookingForm" action="book_process.php" method="POST">
            <div class="form-group">
                <label for="patient_name">اسم المريض:</label>
                <input type="text" id="patient_name" name="patient_name" required>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="department">اختار العيادة / التخصص:</label>
                <select id="department" name="department" required>
                    <option value="">-- اختار التخصص --</option>
                    <option value="باطنية">باطنية</option>
                    <option value="
أسنان">أسنان</option>
                    <option value="أطفال">أطفال</option>
                    <option value="جلدية">جلدية</option>
<option value="نساءوتوليد">نساءوتوليد</option>
                </select>
            </div>

            <div class="form-group">
                <label for="booking_date">تاريخ الموعد:</label>
                <input type="date" id="booking_date" name="booking_date" required>
            </div>

            <button type="submit" id="submitBtn">تأكيد الحجز</button>
        </form>
        <p id="errorMsg"></p>
    </div>
</body>
</html>
