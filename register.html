<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | عيادتي</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🏥 عيادتي
            </div>

            <h1>إنشاء حساب جديد</h1>

            <p class="auth-subtitle">
                أنشئ حسابك للبدء في استخدام عيادتي
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="registerName">
                        الاسم الكامل
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        placeholder="أدخل الاسم الكامل"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="أدخل البريد الإلكتروني"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="أعد إدخال كلمة المرور"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full">
                    إنشاء الحساب
                </button>

            </form>


            <p class="auth-footer">

                لديك حساب بالفعل؟

                <a href="index.html">
                    تسجيل الدخول
                </a>

            </p>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

                  </html>
